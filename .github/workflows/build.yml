name: Java CI

on: [push, pull_request]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '11'
          distribution: 'adopt'
      - name: Права на gradlew
        run: chmod +x gradlew
      - name: Запуск сервиса в фоне
        run: java -jar ./artifacts/app-order.jar &
      - name: Запуск тестов
        run: ./gradlew test --info